x-stack-labels: &stack-labels
  com.dockforge.stack.name: DockForge PHP Stack
  com.dockforge.stack.version: ${STACK_VERSION:-1.0.0}

services:
  web:
    labels: *stack-labels
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: dockforge-php:php-${PHP_VERSION:-8.2}
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_PROFILING: ${APP_PROFILING:-1}
      APP_SLOW_REQUEST_MS: ${APP_SLOW_REQUEST_MS:-500}
    volumes:
      - ./public:/var/www/html
      - ./public/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    labels: *stack-labels
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  db:
    labels: *stack-labels
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: mariadb:${DB_SERVER_VERSION:-12.3.3}
    ports:
      - "${DB_PUBLISHED_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${DB_DATABASE:-my_database}
      MARIADB_USER: ${DB_USERNAME:-user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-user_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./public/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    labels: *stack-labels
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: phpmyadmin:5.2.3-apache
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 1G
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
