services:
  web:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: tes-app:php-${PHP_VERSION:-8.2}
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      CI_ENV: ${CI_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost/MyApp/}
      APP_CDN_URL: ${APP_CDN_URL:-http://localhost/MyApp/theme/}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tehran}
      DB_HOST: db
      DB_USERNAME: ${MARIADB_USER:-user}
      DB_PASSWORD: ${MARIADB_PASSWORD:-user_password}
      DB_DATABASE: ${MARIADB_DATABASE:-my_database}
      DB_DRIVER: mysqli
    volumes:
      - ./public:/var/www/html
      - ./public/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: mariadb:${MARIADB_VERSION:-12.3.3}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-my_database}
      MARIADB_USER: ${MARIADB_USER:-user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-user_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./public/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: phpmyadmin:5-apache
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
